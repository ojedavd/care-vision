name: Source-only checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy-and-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files and committed history
        run: |
          python3 tools/check_repository_hygiene.py
          python3 tools/check_repository_hygiene.py --history
      - name: Install pinned project dependencies
        run: |
          python3 -m pip install uv==0.11.32
          uv sync --frozen
      - name: Privacy, protocol and sampling tests
        run: uv run --frozen pytest -q tests/test_repository_hygiene.py tests/test_contracts.py tests/test_webp_wire.py tests/test_uniform_budget_sampling.py
      - name: Synthetic local closed loop
        run: uv run --frozen pytest -q tests/test_sampler.py tests/test_commands.py tests/test_controller.py tests/test_spool.py tests/test_closed_loop.py
